name: Android CI

on:
  push:
    branches: [ "master" ]
    tags: [ "*" ]
  pull_request:
    branches: [ "master" ]
  workflow_dispatch:

permissions:
  contents: write

env:
  SUBMIT_DEPENDENCY_GRAPH: ${{ github.event_name != 'pull_request' && (github.ref == 'refs/heads/master' || github.ref_type == 'tag') }}

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          dependency-graph: ${{ env.SUBMIT_DEPENDENCY_GRAPH && 'generate-and-submit' || 'disabled' }}

      - name: Run unit tests
        continue-on-error: true
        run: ./gradlew app:testDebugUnitTest

      - name: Build debug APK
        run: ./gradlew app:assembleDebug

      - name: Rename debug APK
        run: mv app/build/outputs/apk/debug/app-debug.apk app/build/ChromeYt_debug.apk

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          path: app/build/ChromeYt_debug.apk
          if-no-files-found: error
          archive: false

      - name: Decode signing keystore
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
        run: |
          if [ -n "$SIGNING_KEY" ]; then
            echo "$SIGNING_KEY" | base64 -d > keystore.jks
          else
            echo "SIGNING_KEY is not available, release APK will be signed with the debug key"
          fi

      - name: Build release APK
        env:
          KEYSTORE: keystore.jks
          ALIAS: ${{ secrets.ALIAS }}
          KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew app:assembleRelease

      - name: Rename release APK
        run: mv app/build/outputs/apk/release/app-release.apk app/build/ChromeYt_release.apk

      - name: Upload release APK
        uses: actions/upload-artifact@v7
        with:
          path: app/build/ChromeYt_release.apk
          if-no-files-found: error
          archive: false
