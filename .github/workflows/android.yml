name: Android CI

on:
  push:
    branches: [ "master" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "master" ]
  workflow_dispatch:

permissions:
  contents: write

env:
  IS_MASTER_PUSH: ${{ github.event_name == 'push' && github.ref == 'refs/heads/master' }}
  IS_TAG_PUSH: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/') }}
  IS_SIGNED_BUILD: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/')) }}

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          dependency-graph: ${{ env.IS_MASTER_PUSH == 'true' && 'generate-and-submit' || 'disabled' }}

      - name: Run unit tests
        continue-on-error: true
        run: ./gradlew app:testDebugUnitTest

      - name: Build debug APK
        run: ./gradlew app:assembleDebug

      - name: Rename debug APK
        run: mv app/build/outputs/apk/debug/app-debug.apk app/build/ChromeYt_debug.apk

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          path: app/build/ChromeYt_debug.apk
          if-no-files-found: error
          archive: false

      - name: Build release APK
        env:
          SIGNING_KEY: ${{ env.IS_SIGNED_BUILD == 'true' && secrets.SIGNING_KEY || '' }}
          ALIAS: ${{ env.IS_SIGNED_BUILD == 'true' && secrets.ALIAS || '' }}
          KEY_STORE_PASSWORD: ${{ env.IS_SIGNED_BUILD == 'true' && secrets.KEY_STORE_PASSWORD || '' }}
          KEY_PASSWORD: ${{ env.IS_SIGNED_BUILD == 'true' && secrets.KEY_PASSWORD || '' }}
        run: |
          if [ -n "$SIGNING_KEY" ]; then
            echo "$SIGNING_KEY" | base64 -d > keystore.jks
            export KEYSTORE=keystore.jks
          else
            echo "SIGNING_KEY is not available, release APK will be signed with the debug key"
          fi
          ./gradlew app:assembleRelease

      - name: Rename release APK
        run: mv app/build/outputs/apk/release/app-release.apk app/build/ChromeYt_release.apk

      - name: Upload release APK
        uses: actions/upload-artifact@v7
        with:
          path: app/build/ChromeYt_release.apk
          if-no-files-found: error
          archive: false

      - name: Create draft release
        if: env.IS_TAG_PUSH == 'true'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: ChromeYt ${{ github.ref_name }}
          draft: true
          files: |
            app/build/ChromeYt_debug.apk
            app/build/ChromeYt_release.apk
          fail_on_unmatched_files: true
